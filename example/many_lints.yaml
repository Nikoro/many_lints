# Per-rule configuration for many_lints.
#
# Every rule is off by default, so a project selects a rule set with `preset:`.
# This example carries one file per rule, so it takes the broadest preset and
# then switches on the rules that sit outside every preset. A real project
# normally wants `core` or `recommended`.
preset: opinionated

# The rest of this file demonstrates `exclude`: the rule stays enabled
# everywhere else, but is skipped for the listed paths. See
# lib/excluded/excluded_example.dart.
#
# The same block can instead live under a top-level `many_lints:` key in
# `analysis_options.yaml` — the two forms are equivalent. If both exist, this
# file wins outright and the section there is ignored (they are not merged).
rules:
  avoid_only_rethrow:
    exclude:
      - lib/excluded/**

  # These sit outside every preset, so the example enables them by name.
  #
  # `prefer_container` and `use_gap` are each the losing half of a
  # contradiction: `prefer_container` merges nested widgets *into* a Container
  # while `prefer_padding_over_container` unwraps one, and `use_gap` rewrites a
  # spacing SizedBox to `Gap` while `prefer_spacing` rewrites it to `spacing:`.
  # A real project picks one side of each pair — this example carries both only
  # because it documents every rule.
  prefer_container: true
  use_gap: true

  # These assume a package a project may not depend on.
  list_all_equatable_fields: true
  prefer_equatable_mixin: true

  # These take a side a coherent codebase may reasonably reject.
  avoid_unnecessary_option: true
  avoid_get_or_else_swallowing_failure: true

  # Naming conventions, which are a project's own choice.
  prefer_use_prefix: true
  use_sliver_prefix: true

  # Config-driven like the `banned_*` family below: it reports nothing until
  # `error_types` names the hierarchy that must stay intact. Scoped with
  # `include:` to its own example, since `Failure` is a common name across the
  # other fpdart examples and the rule would otherwise report from all of them.
  avoid_ad_hoc_left_type:
    error_types: [Failure]
    include:
      - lib/avoid_ad_hoc_left_type_example.dart

  # A file-organization convention, so it sits outside every preset. Scoped
  # with `include:` to its own example: this example package deliberately keeps
  # several declarations per file to document each rule in one place, so the
  # rule would otherwise report from nearly every file here.
  #
  # `groups:` is what lets one rule cover the type-specific conventions too —
  # each group carries its own budget, so the example file's one bloc and one
  # notifier do not count against each other.
  prefer_single_declaration_per_file:
    include:
      - lib/prefer_single_declaration_per_file_example.dart
    groups:
      - kinds: [class]
        types: [Bloc, Cubit]
        message: 'One bloc per file.'
      - kinds: [class]
        types: [Notifier]
        message: 'One notifier per file.'

  # `use_class_suffix` and `use_class_prefix` report nothing until configured:
  # they enforce your naming convention, not a built-in one. `package:` is
  # optional — omit it to match a type of that name from any library,
  # including one declared in this package.
  use_class_suffix:
    entries:
      - type: Bloc
        package: bloc
        suffix: Bloc

  use_class_prefix:
    entries:
      - type: Repository
        prefix: Db

  # The `avoid_banned_*` family and `banned_usage` are entirely config-driven:
  # they enforce *your* policy, so they report nothing until a `banned:` entry
  # names something. `deny:` matches exactly; `deny_pattern:` matches a regular
  # expression anchored to the whole value; `in:` scopes an entry to globs.
  # `in:` normally scopes an entry to a layer (`lib/domain/**`). The example
  # package keeps every file flat in `lib/`, so these entries scope to the one
  # example file instead — the mechanism is identical.
  avoid_banned_imports:
    banned:
      - deny: ['dart:io']
        in: ['lib/avoid_banned_imports_example.dart']
        message: 'The domain layer must stay platform-independent.'

  avoid_banned_exports:
    banned:
      - deny_pattern: ['.*_internal\.dart']
        in: ['lib/avoid_banned_exports_example.dart']
        message: 'Internal libraries must not be part of the public API.'

  avoid_banned_types:
    banned:
      - deny: ['LegacyUser']
        in: ['lib/avoid_banned_types_example.dart']
        message: 'Use User instead; LegacyUser is removed in v3.'

  avoid_banned_names:
    banned:
      - deny: ['data', 'temp', 'manager']
        in: ['lib/avoid_banned_names_example.dart']
        message: 'Name it for what it holds.'

  avoid_banned_annotations:
    banned:
      - deny: ['visibleForTesting']
        in: ['lib/avoid_banned_annotations_example.dart']
        message: 'Production code must not widen visibility for tests.'

  banned_usage:
    banned:
      - deny: ['DateTime.now']
        in: ['lib/banned_usage_example.dart']
        message: 'Inject a clock so this stays testable.'

  # In no preset — merging two independent enum branches is a judgement call,
  # so the rule is enabled here only to demonstrate it.
  no_equal_switch_case:
    enabled: true

  # In no preset — the right member order is a house style, so the rule
  # reports only where a project declares one. Enabled here to demonstrate it.
  member_ordering:
    enabled: true

  # In no preset — naming is where codebases disagree most, and a predicate
  # like `screen.atLeast(...)` reads fine without a question verb.
  prefer_boolean_prefixes:
    enabled: true

  # In no preset — a naming convention rather than a correctness question.
  prefer_correct_callback_field_name:
    enabled: true

  # In no preset — a line budget is a house style, and the default of 50 is
  # stricter than many codebases run. Enabled here to demonstrate it.
  avoid_long_functions:
    enabled: true

  # In no preset — each is a budget or an API-shape judgement rather than a
  # correctness question. Enabled here to demonstrate them.
  avoid_complex_conditions:
    enabled: true
  avoid_long_parameter_list:
    enabled: true
  prefer_getter_over_method:
    enabled: true

  # In no preset — literal spelling, branch ordering and guard shape are all
  # house styles. Enabled here to demonstrate them.
  double_literal_format:
    enabled: true
  avoid_inconsistent_digit_separators:
    enabled: true
  prefer_early_return:
    enabled: true
  avoid_negated_conditions:
    enabled: true

  # Budget rules. The defaults are sized for real code, so each example file
  # lowers its own budget far enough to demonstrate the rule in a file short
  # enough to read.
  avoid_long_files:
    max_lines: 20
    include: ["lib/avoid_long_files_example.dart"]
  max_imports:
    max_imports: 5
    include: ["lib/max_imports_example.dart"]
  max_statements:
    max_statements: 8
    include: ["lib/max_statements_example.dart"]
  avoid_high_cyclomatic_complexity:
    enabled: true

  # Widget metrics. The nesting default is 8; the widget-count example lowers
  # its budget so the file stays short enough to read.
  avoid_deep_widget_nesting:
    enabled: true
  avoid_too_many_widgets_per_build:
    max_widgets: 10
    include: ["lib/avoid_too_many_widgets_per_build_example.dart"]

  # Code metrics and naming. The ordering rules report nothing without an
  # `order:`, so each example file configures the one it demonstrates.
  avoid_deep_nesting:
    enabled: true
  avoid_too_many_methods:
    max_methods: 5
    include: ["lib/avoid_too_many_methods_example.dart"]
  match_getter_setter_field_names:
    enabled: true
  prefer_correct_error_name:
    enabled: true
  prefer_correct_handler_name:
    enabled: true
  use_setstate_synchronously:
    enabled: true
  enum_constants_ordering:
    order: alphabetical
    include: ["lib/enum_constants_ordering_example.dart"]
  map_keys_ordering:
    order: alphabetical
    include: ["lib/map_keys_ordering_example.dart"]
  parameters_ordering:
    order: alphabetical
    include: ["lib/parameters_ordering_example.dart"]

  # Ordering siblings and the style/naming batch. The ordering rules and the
  # two pattern-driven naming rules report nothing without their option, so
  # each is scoped to the file that demonstrates it.
  arguments_ordering:
    order: alphabetical
    include: ["lib/arguments_ordering_example.dart"]
  initializers_ordering:
    enabled: true
  record_fields_ordering:
    order: alphabetical
    include: ["lib/record_fields_ordering_example.dart"]
  pattern_fields_ordering:
    order: alphabetical
    include: ["lib/pattern_fields_ordering_example.dart"]
  prefer_conditional_expressions:
    enabled: true
  prefer_named_boolean_parameters:
    enabled: true
  prefer_typedefs_for_callbacks:
    enabled: true
  prefer_declaring_const_constructor:
    enabled: true
  prefer_correct_setter_parameter_name:
    enabled: true
  prefer_correct_identifier_length:
    include: ["lib/prefer_correct_identifier_length_example.dart"]
  prefer_prefixed_global_constants:
    prefix: k
    include: ["lib/prefer_prefixed_global_constants_example.dart"]
  match_class_name_pattern:
    pattern: '[A-Z][A-Za-z0-9]*Page'
    include: ["lib/match_class_name_pattern_example.dart"]

  # The naming batch that judges a file's PATH rather than its AST. Every file
  # in this package is named `<rule>_example.dart` and sits flat in `lib/`, so
  # each of these is scoped to the one file that demonstrates it — otherwise
  # `prefer_match_file_name` alone would report from all ~240 of them.
  prefer_match_file_name:
    include: ["lib/prefer_match_file_name_example.dart"]
  match_lib_folder_structure:
    enabled: true
  prefer_correct_test_file_name:
    enabled: true
  format_test_name:
    pattern: 'should .*'
    include: ["lib/format_test_name_example.dart"]

  # A type-name budget is a house style, so the rule sits outside every preset.
  # Scoped to its own example: this package documents rules with deliberately
  # short fixture names (`Ab`, `Foo`) that the rule is right to flag elsewhere.
  prefer_correct_type_name:
    include: ["lib/prefer_correct_type_name_example.dart"]

  # Sentence-shaped comments are a house style, so the rule sits outside every
  # preset. Scoped to its own example: this package's other files open their
  # comments with a rule name (`avoid_only_rethrow`, lowercase by definition).
  format_comment:
    include: ["lib/format_comment_example.dart"]

  # What counts as "magic" is a house style, so both sit outside every preset.
  # Scoped to their own examples: this package is full of deliberately literal
  # fixtures, which is exactly what these rules report.
  no_magic_number:
    include: ["lib/no_magic_number_example.dart"]
    # `Insets` stands in for EdgeInsets, which this package cannot depend on:
    # the point is that a measurement constructor takes numbers that are not a
    # policy. The real defaults already carry EdgeInsets, Gap and friends.
    additional_ignored_invocations: [Insets]
  no_magic_string:
    include: ["lib/no_magic_string_example.dart"]

  # Both impose an architecture rather than catching a defect, so they sit
  # outside every preset.
  prefer_widget_private_members:
    enabled: true
  prefer_extracting_callbacks:
    enabled: true

  # Style choices a coherent codebase may reasonably reject, so all four sit
  # outside every preset.
  prefer_named_parameters:
    include: ["lib/prefer_named_parameters_example.dart"]
  prefer_explicit_parameter_names:
    include: ["lib/prefer_explicit_parameter_names_example.dart"]
  avoid_accessing_other_classes_private_members:
    enabled: true
  # Reports nothing until it names the APIs worth pinning.
  prefer_explicit_type_arguments:
    methods: [showDialog]
    include: ["lib/prefer_explicit_type_arguments_example.dart"]
