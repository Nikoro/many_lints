name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.0"
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - name: Get dependencies
        run: dart pub get --no-example
      - name: Check code formatting
        run: dart --enable-experiment=primary-constructors format . --output=none --set-exit-if-changed
      - name: Static code analysis
        run: dart analyze
      - name: Verify rule examples
        run: dart run tool/verify_examples.dart
      - name: Run unit tests
        run: dart test --test-randomize-ordering-seed=random --fail-fast
