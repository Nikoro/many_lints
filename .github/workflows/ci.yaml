name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - name: Get dependencies
        run: dart pub get --no-example
      - name: Get example dependencies
        working-directory: example
        run: flutter pub get
      - name: Check code formatting
        run: dart format --enable-experiment=primary-constructors . --output=none --set-exit-if-changed
      - name: Static code analysis
        run: dart analyze
      - name: Verify rule examples
        run: dart run tool/verify_examples.dart
      - name: Run unit tests
        run: dart test --test-randomize-ordering-seed=random --fail-fast
