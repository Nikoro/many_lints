name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pub.dev
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      # Must come after flutter-action: this action performs the OIDC exchange
      # that authenticates `dart pub publish`, and its Dart must win in PATH.
      - uses: dart-lang/setup-dart@v1
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - name: Install dependencies
        run: dart pub get --no-example

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      
      - name: Verify pubspec.yaml version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          if [ "$PUBSPEC_VERSION" != "$TAG" ]; then
            echo "Error: pubspec.yaml version ($PUBSPEC_VERSION) does not match tag version ($TAG)"
            exit 1
          fi
          echo "✓ Version validated: $PUBSPEC_VERSION"

      - name: Verify changelog entry exists
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! awk -v version="$VERSION" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              found = 1
            }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "::error::No CHANGELOG entry found for version $VERSION"
            exit 1
          fi
      
      - name: Check code formatting
        run: dart format --enable-experiment=primary-constructors . --output=none --set-exit-if-changed

      - name: Static code analysis
        run: dart analyze --fatal-infos

      - name: Verify rule examples
        run: dart run tool/verify_examples.dart

      - name: Verify documentation sources
        run: dart run tool/verify_documentation.dart

      - name: Build docs
        working-directory: docs
        run: bun run build
        
      - name: Run unit tests
        run: dart test --test-randomize-ordering-seed=random
      
      - name: Dry run publish
        run: dart pub publish --dry-run
      
      # Re-mint the OIDC credential immediately before uploading. setup-dart
      # exchanges it once, near the start of the job, and pub.dev rejects it
      # with "Invalid JWT token: invalid timestamps" if the gates above push
      # the upload past its validity window.
      - name: Refresh pub.dev credentials
        uses: dart-lang/setup-dart@v1

      - name: Publish to pub.dev
        run: dart pub publish --force
  
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Extract changelog content for this version
          awk -v version="$VERSION" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              flag = 1
              next
            }
            /^## / { flag = 0 }
            flag
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::No CHANGELOG entry found for version $VERSION"
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
